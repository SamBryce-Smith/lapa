[project]
name = "lapa"
requires-python = ">= 3.7"
version = "0.0.7"
dependencies = [
    "setuptools",
    "tqdm",
    "numpy<=1.23",
    "click",
    "pandas",
    "pybigwig",
    "scipy",
    "bamread>=0.0.10",
    "pyranges>=0.0.71,<=0.0.123",
    "sorted-nearest>=0.0.35",
    "kipoiseq>=0.3.0",
    "matplotlib",
    "betabinomial",
    "gffutils<0.11"
]
description = "Tools for alternative polyadenylation detection and analysis from diverse data sources (3'seq and long-reads) and transcript start site detection and analysis from long-read RNA-seq."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "M. Hasan Çelik", email = "muhammedhasancelik@gmail.com" },
    { name = "Sam Bryce-Smith", email = "SamBryce-Smith@users.noreply.github.com" },
]
keywords = ["genomics", "long read RNA-seq", "APA"]
classifiers = [
    "Natural Language :: English",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]


[project.urls]
Homepage = "https://github.com/SamBryce-Smith/lapa"

[project.scripts]
lapa = "lapa.main:cli_lapa"
lapa_tss = "lapa.main:cli_lapa_tss"
lapa_link_tss_to_tes = "lapa.main:cli_lapa_link_tss_to_tes"
lapa_correct_talon_gtf = "lapa.main:cli_lapa_correct_talon_gtf"
lapa_correct_talon = "lapa.main:cli_lapa_correct_talon"

[project.optional-dependencies]
test = ["pytest", "pytest-xdist"]

[tool.hatch.build.targets.wheel]
packages = ["lapa"]


[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.tasks]

# --- Shared conda dependencies ---
[tool.pixi.feature.common.dependencies]
python = "3.7.12.*"
pyranges = ">=0.0.71,<=0.0.123"
setuptools = "*"
tqdm = "*"
numpy = "<=1.23"
click = "*"
pandas = "*"
pybigwig = "*"
scipy = "*"
matplotlib = "*"
sorted_nearest = ">=0.0.35"
bamread = ">=0.0.10"
kipoiseq = ">=0.3.0"
# dependency of kipoiseq, need to restrict to prevent importlib.metadata ModuleNotFoundError
gffutils = "<0.11"

[tool.pixi.feature.common.pypi-dependencies]
betabinomial = "*"

# --- Non-editable install (default env) ---
[tool.pixi.feature.prod.pypi-dependencies]
lapa = { path = ".", editable = false }

# --- Editable install + test deps (dev env) ---
[tool.pixi.feature.dev.pypi-dependencies]
lapa = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
pytest = "*"
pytest-xdist = "*"

# --- Environments ---
[tool.pixi.environments.default]
features = ["common", "prod"]
solve-group = "default"

[tool.pixi.environments.lapa-dev]
features = ["common", "dev"]
solve-group = "default"
